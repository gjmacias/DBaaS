
image:
  repository: postgres
  tag: 16-alpine
  pullPolicy: IfNotPresent

secret:
  name: postgres-secret
  databaseKey: POSTGRES_DB
  usernameKey: POSTGRES_USER
  passwordKey: POSTGRES_PASSWORD

storage:
  size: 2Gi
  storageClassName: standard

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
