services:
  backend:
    image:                ghcr.io/gjmacias/dbaas:latest
    container_name:       dbaas-backend
    restart:              unless-stopped
    env_file:             [.env]
    environment:
      CONTROL_DB_HOST:    control-db
      CONTROL_DB_PORT:    5432
      MANAGED_DB_HOST:    managed-db
      MANAGED_DB_PORT:    5432
    depends_on:
      control-db:
        condition:        service_healthy
      managed-db:
        condition:        service_healthy
    ports:                [127.0.0.1:8000:8000]

  control-db:
    image:                postgres:16-alpine
    container_name:       dbaas-control-db
    restart:              unless-stopped
    environment:
      POSTGRES_DB:        ${CONTROL_DB_NAME}
      POSTGRES_USER:      ${CONTROL_DB_USER}
      POSTGRES_PASSWORD:  ${CONTROL_DB_PASSWORD}
    ports:                [127.0.0.1:5433:5432]
    volumes:              [control_data:/var/lib/postgresql/data]
    healthcheck:
      test:               ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval:           5s
      timeout:            5s
      retries:            5

  managed-db:
    image:                postgres:16-alpine
    container_name:       dbaas-managed-db
    restart:              unless-stopped
    environment:
      POSTGRES_DB:        ${MANAGED_DB_NAME}
      POSTGRES_USER:      ${MANAGED_DB_USER}
      POSTGRES_PASSWORD:  ${MANAGED_DB_PASSWORD}
    ports:                [127.0.0.1:5434:5432]
    volumes:              [managed_data:/var/lib/postgresql/data]
    healthcheck:
      test:               ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval:           5s
      timeout:            5s
      retries:            5

volumes:
  control_data:
  managed_data: